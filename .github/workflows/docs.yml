name: Generate docs

on:
  pull_request:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docs
        run: make docs

      - name: Commit updated docs.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs.md
          git diff --cached --quiet || git commit -m "docs: regenerate docs.md"
          git push
